services:
  # Database PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: banco_postgres
    environment:
      POSTGRES_USER: bancario
      POSTGRES_PASSWORD: secure_password_123
      POSTGRES_DB: banco_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bancario"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    container_name: banco_backend
    environment:
      DATABASE_URL: postgresql+psycopg://bancario:secure_password_123@postgres:5432/banco_app
      SECRET_KEY: your-super-secret-key-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      DEBUG: "false"
      ENV: production
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  # Frontend Web
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: banco_frontend
    ports:
      - "8501:8501"
    environment:
      STREAMLIT_SERVER_HEADLESS: true
      STREAMLIT_SERVER_PORT: 8501
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      API_URL: "http://backend:8000/api"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app

  # Redis (para cache e sessões)
  redis:
    image: redis:7-alpine
    container_name: banco_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prometheus (monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: banco_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  # Grafana (visualization)
  grafana:
    image: grafana/grafana:latest
    container_name: banco_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: banco_network
